<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{NAME}} - {{POSITION}} Resume</title>
<style>
@page{size:A4;margin:15mm 0 15mm 0}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,Helvetica,sans-serif;
  font-size:11pt;
  color:#000;
  line-height:1.4;
  background:#f0f0f0;
  display:flex;
  justify-content:center;
  padding:20px;
}
.resume{
  width:210mm;
  min-height:297mm;
  background:#fff;
  padding:0 42px 40px;
}
.header{text-align:center}
.header h1{
  font-size:28px;
  font-weight:700;
  color:#000;
  margin-bottom:8px;
}
.contact{
  font-size:14px;
  color:#000;
}
.contact span{margin:0 5px}
.header hr{
  border:0;
  border-top:1px solid #000;
  margin:22px 0 28px;
}
.section{margin-bottom:30px}
.section-title{
  font-size:17px;
  font-weight:700;
  color:#000;
  text-transform:uppercase;
  border-bottom:3px solid #000;
  padding-bottom:4px;
  margin-bottom:18px;
}
.summary{
  font-size:15px;
  color:#000;
  line-height:1.5;
}
.skills-table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
.skills-table td{
  border:1px solid #000;
  padding:8px;
  vertical-align:top;
  color:#000;
}
.skills-table .label{
  width:20%;
  font-weight:700;
}
.experience-item{margin-bottom:26px}
.job-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
.job-title{
  font-size:16px;
  font-weight:700;
  color:#000;
}
.job-company{
  color:#000;
  font-weight:700;
  margin-top:2px;
}
.job-date{
  color:#000;
  font-size:14px;
  white-space:nowrap;
}
.experience-item ul{
  margin:10px 0 0 18px;
}
.experience-item li{
  color:#000;
  margin-bottom:6px;
  line-height:1.45;
}
.education-item{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:12px;
}
.edu-degree{
  font-size:16px;
  font-weight:700;
  color:#000;
}
.edu-school{
  font-size:15px;
  color:#000;
}
.edu-details{
  font-weight:700;
  color:#000;
  white-space:nowrap;
}
.additional-section{margin-bottom:30px}
.additional-section h2{
  font-size:17px;
  color:#000;
  border-bottom:3px solid #000;
  padding-bottom:4px;
  margin-bottom:18px;
  text-transform:uppercase;
}
@media print{
  body{background:#fff;padding:0}
  .resume{margin:0;box-shadow:none;min-height:267mm}
}
</style>
</head>
<body>

<div class="resume">

  <header class="header">
    <h1>{{NAME}}</h1>
    <div class="contact">
      {{LOCATION}} <span>|</span> {{EMAIL}} <span>|</span> {{PHONE}}
    </div>
    <hr>
  </header>

  <section class="section">
    <h2 class="section-title">Professional Summary</h2>
    <p class="summary">{{SUMMARY}}</p>
  </section>

  <section class="section">
    <h2 class="section-title">Technical Skills</h2>
    <table class="skills-table">
{{SKILLS_TABLE}}
    </table>
  </section>

  <section class="section">
    <h2 class="section-title">Professional Experience</h2>

{{EXPERIENCE_ITEMS}}

  </section>

  <section class="section">
    <h2 class="section-title">Education</h2>
{{EDUCATION_ITEMS}}
  </section>

{{ADDITIONAL_SECTIONS}}

</div>

</body>
</html>
